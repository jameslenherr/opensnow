name: Snow email

on:
  schedule:
    # 0:50am Utah time year-round. Cron is UTC, so two runs are scheduled:
    # 6:50 UTC = 0:50am MDT (daylight time), 7:50 UTC = 0:50am MST (winter).
    # The "check" job below keeps whichever one is 0:50am in Utah today.
    - cron: "50 6 20-31 10 *"         # Oct 20 - 31
    - cron: "50 7 20-31 10 *"
    - cron: "50 6 * 11,12,1,2,3,4 *"  # Nov 1 - Apr 30
    - cron: "50 7 * 11,12,1,2,3,4 *"
    - cron: "50 6 1 5 *"              # May 1
    - cron: "50 7 1 5 *"
  workflow_dispatch:  # manual run, any time of year

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/Denver date +%Z)  # MDT or MST
          if [ "$zone" = MDT ]; then want="50 6"; else want="50 7"; fi
          if [ "$EVENT" != schedule ] || [[ "$CRON" == "$want "* ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping: Utah is on $zone, so the other scheduled run sends today"
          fi

  send:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90  # covers the 60 min retry wait
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python snow_email.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
