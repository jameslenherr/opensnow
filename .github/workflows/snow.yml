name: Snow email

on:
  schedule:
    # 5:50am Utah time year-round (GitHub handles daylight saving)
    - cron: "50 5 20-31 10 *"         # Oct 20 - 31
      timezone: "America/Denver"
    - cron: "50 5 * 11,12,1,2,3,4 *"  # Nov 1 - Apr 30
      timezone: "America/Denver"
    - cron: "50 5 1 5 *"              # May 1
      timezone: "America/Denver"
  workflow_dispatch:  # manual run, any time of year

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # covers the 60 min retry wait
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python snow_email.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
