# Each location needs a Utah Snow Ensemble text-table URL.
locations:
  - name: Alta-Collins (CLN)
    url: https://weather.utah.edu/text/ensgefsdslccforecast.html
    # Optional: elevation for the daily high/low temps (Open-Meteo only).
    # Defaults to the snow forecast's grid-point elevation. 9900 matches OpenSnow.
    temp_elevation_ft: 9900
    # Optional: folder of HRRR hourly text files for the 48-h table (Collins/CLN only).
    hourly_dir: https://home.chpc.utah.edu/~steenburgh/ml/
    # Hourly layout: "scroll" (one wide table, swipe sideways) or "blocks" (stacked 12-hour tables)
    hourly_layout: scroll

windows:
  - {label: "24 h", hours: 24}
  - {label: "5 day", hours: 120}
  - {label: "10 day", hours: 240}

percentiles: [P90]  # first one listed is used in the subject line

# Flag runs older than this (hours)
max_age_hours: 36

# Wait before retrying a failed fetch; a second failure emails "not available"
retry_delay_min: 60
